<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img"><defs><linearGradient id="neon"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><radialGradient id="halo"><stop stop-color="#7c3aed" stop-opacity=".24"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-opacity=".06"/></pattern></defs><style>@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{0%{transform:translateX(-130px);opacity:0}12%{opacity:.55}85%{opacity:.55}100%{transform:translateX(970px);opacity:0}}.orbiter{animation:orbit 22s linear infinite;transform-origin:0px 0px}.orbiter-slow{animation:orbit 34s linear infinite reverse;transform-origin:0px 0px}.pulse{animation:pulse 5s ease-in-out infinite}.scan{animation:drift 9s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.orbiter,.orbiter-slow,.pulse,.scan{animation:none}.scan{display:none}}</style><title>astromonaa — web development, neon orbital banner</title><rect width="1200" height="360" rx="22" fill="#0d1117"/><rect x=".5" y=".5" width="1199" height="359" rx="22" fill="url(#grid)" stroke="#303043"/><circle cx="942" cy="170" r="245" fill="url(#halo)"/><path class="pulse" d="M52 46H150" stroke="url(#neon)" stroke-width="3"/><text x="52" y="80" fill="#8b96aa" font-family="monospace" font-size="13" letter-spacing="4">PERSONAL SPACE / 01</text><text x="49" y="170" fill="#f0f4fc" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-4">astromonaa<tspan fill="#67e8f9">.</tspan></text><text x="52" y="213" fill="#bcc5d6" font-family="Segoe UI,Arial,sans-serif" font-size="21" letter-spacing="3">WEB DEVELOPMENT · RUST · BLOCKCHAIN</text><rect x="52" y="256" width="346" height="36" rx="18" fill="#161c2b" stroke="#31394d"/><circle class="pulse" cx="74" cy="274" r="4" fill="#67e8f9"/><text x="90" y="279" fill="#b6c7de" font-family="monospace" font-size="12">RUST / WEB / BLOCKCHAIN</text><g transform="translate(957 170)"><circle r="69" fill="#111322" stroke="#a78bfa" stroke-opacity=".25"/><circle r="48" fill="#13172a" stroke="#67e8f9" stroke-opacity=".45"/><ellipse rx="150" ry="50" transform="rotate(-32)" fill="none" stroke="url(#neon)" stroke-width="1.8"/><ellipse rx="115" ry="99" transform="rotate(29)" fill="none" stroke="#a78bfa" stroke-opacity=".4"/><g class="orbiter"><circle cx="119" cy="-73" r="6" fill="#67e8f9"/><circle cx="119" cy="-73" r="12" fill="#67e8f9" opacity=".12"/></g><g class="orbiter-slow"><circle cx="-100" cy="-43" r="4" fill="#c4b5fd"/></g><path d="M-13 14L0 -22L13 14M-8 3H8" fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round"/></g><path d="M52 325H1148" stroke="#252a3a"/><text x="1148" y="311" text-anchor="end" fill="#657086" font-family="monospace" font-size="11" letter-spacing="2">CREATE. ITERATE. EXPLORE.</text></svg>