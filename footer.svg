<svg xmlns="http://www.w3.org/2000/svg" width="900" height="68" viewBox="0 0 900 68" role="img"><defs><linearGradient id="neon"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><radialGradient id="halo"><stop stop-color="#7c3aed" stop-opacity=".24"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-opacity=".06"/></pattern></defs><style>@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{0%{transform:translateX(-130px);opacity:0}12%{opacity:.55}85%{opacity:.55}100%{transform:translateX(970px);opacity:0}}.orbiter{animation:orbit 22s linear infinite;transform-origin:0px 0px}.orbiter-slow{animation:orbit 34s linear infinite reverse;transform-origin:0px 0px}.pulse{animation:pulse 5s ease-in-out infinite}.scan{animation:drift 9s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.orbiter,.orbiter-slow,.pulse,.scan{animation:none}.scan{display:none}}</style><title>Create. Iterate. Explore.</title><path d="M0 1H900" stroke="url(#neon)" stroke-opacity=".5"/><text x="450" y="38" text-anchor="middle" fill="#8896b0" font-family="monospace" font-size="12" letter-spacing="4">CREATE. ITERATE. EXPLORE.</text><circle class="pulse" cx="450" cy="58" r="2" fill="#67e8f9"/></svg>